name: Android checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/test-web-playback.cjs
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - run: bash gradlew :app:assembleDebug :app:testDebugUnitTest :innertube:testDebugUnitTest :spotify:test --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: Spock-preview
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/build/test-results/**/*.xml'
